[package]
name = "dayline"
version = "0.1.0"
description = "Local-first task and time management"
authors = ["Dayline"]
edition = "2021"

[lib]
name = "dayline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
